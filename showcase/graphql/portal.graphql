"""
The merchant portal's API. GraphQL rather than REST because a merchant dashboard
asks for a shipment, its parcels and their latest scan in one round trip, and
the REST API would need four.

  vibex import graphql showcase/graphql/portal.graphql showcase/portal.endpoints.json
"""

scalar DateTime

type Query {
  "One shipment with its parcels and their current state"
  shipment(id: ID!): Shipment
  "The calling merchant's shipments, newest first"
  shipments(status: ParcelStatus, bookedSince: DateTime, first: Int = 25, after: String): ShipmentConnection!
  "Everything known about one parcel, by its tracking number"
  parcel(trackingNumber: String!): Parcel
  "Depots and the postcodes they serve"
  depots: [Depot!]!
}

type Mutation {
  "Book a shipment and mint a tracking number per parcel"
  bookShipment(input: BookShipmentInput!): BookShipmentPayload!
  "Cancel before collection; fails once any parcel has been scanned"
  cancelShipment(id: ID!): CancelShipmentPayload!
  "Ask the routing engine to sequence a route's stops"
  sequenceRoute(routeId: ID!): Route!
}

type Subscription {
  "Every scan on the calling merchant's parcels, as it is ingested"
  parcelScanned(shipmentId: ID): Scan!
}

type Shipment {
  id: ID!
  reference: String
  serviceLevel: ServiceLevel!
  recipient: Recipient!
  destination: Address!
  parcels: [Parcel!]!
  bookedAt: DateTime!
}

type ShipmentConnection {
  nodes: [Shipment!]!
  cursor: String
  totalCount: Int!
}

type Parcel {
  id: ID!
  trackingNumber: String!
  status: ParcelStatus!
  attempts: Int!
  weightGrams: Int!
  scans: [Scan!]!
  currentDepot: Depot
}

type Scan {
  id: ID!
  type: ScanType!
  scannedAt: DateTime!
  receivedAt: DateTime!
  depot: Depot
}

type Depot {
  id: ID!
  code: String!
  name: String!
  address: Address!
}

type Route {
  id: ID!
  serviceDate: DateTime!
  sequencedAt: DateTime
  stops: [Stop!]!
}

type Stop {
  id: ID!
  sequence: Int!
  parcel: Parcel!
  windowStart: DateTime!
  windowEnd: DateTime!
}

type Recipient {
  id: ID!
  name: String!
  phone: String
  email: String
}

type Address {
  id: ID!
  line1: String!
  line2: String
  city: String!
  postcode: String!
  country: String!
}

input BookShipmentInput {
  reference: String
  serviceLevel: ServiceLevel!
  recipient: RecipientInput!
  destination: AddressInput!
  parcels: [ParcelInput!]!
}

input RecipientInput {
  name: String!
  phone: String
  email: String
}

input AddressInput {
  line1: String!
  line2: String
  city: String!
  postcode: String!
  country: String!
}

input ParcelInput {
  weightGrams: Int!
  reference: String
}

type BookShipmentPayload {
  shipment: Shipment!
  labelUrl: String!
}

type CancelShipmentPayload {
  shipment: Shipment!
  refundedMinor: Int!
}

enum ServiceLevel {
  NEXT_DAY
  TWO_DAY
  ECONOMY
}

enum ParcelStatus {
  CREATED
  COLLECTED
  AT_DEPOT
  IN_TRANSIT
  OUT_FOR_DELIVERY
  DELIVERED
  ATTEMPT_FAILED
  AWAITING_INSTRUCTION
  RETURNING
  RETURNED
  LOST
  CANCELLED
}

enum ScanType {
  COLLECTION
  DEPOT_INBOUND
  DEPOT_OUTBOUND
  VEHICLE_LOAD
  DELIVERY
  ATTEMPT_FAILED
  RETURN
}
